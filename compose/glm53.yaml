# GLM-5.3-Flash NVFP4, TP=2 across 2× DGX Spark (head + worker).
# Adapted from mmastrac/glm-5.3-flash-4x-gx10 compose/glm53.yaml.
#
# Same file on both boxes; only ROLE / NODE_RANK differ:
#   head:   ROLE=head   NODE_RANK=0
#   worker: ROLE=worker NODE_RANK=1
#
# Mentat image: either side may start first (registration retries).
# Host mentatd (compose/mentatd.yaml) must be running on both nodes.
#
# network_mode: host is required — RoCE/NCCL needs real interfaces.

name: glm53-flash-2x-spark

services:
  glm53:
    image: ${IMAGE:-glm53-spark:2x-sm121}
    build:
      context: ../image
      dockerfile: Dockerfile
      args:
        BASE: ${BASE:-vllm/vllm-openai:glm53-flash-arm64-cu130}
        MENTAT_VERSION: ${MENTAT_VERSION:-0.6.0}
    container_name: glm53
    network_mode: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
      # Crash must not dump core (RM lock / box wedge risk on GB10).
      core: 0
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      # Entire host ~/.cache → /root/.cache so HF Hub + JIT/Triton share standard layout.
      # HF weights: /root/.cache/huggingface (no /var/tmp). Do not nest a second mount under this.
      - ${HOST_CACHE:-${HOME}/.cache}:/root/.cache
      # Optional LibertAI / ext plugins (inert unless env enables them).
      - ${EXT_DIR:-${HOME}/ext}:/opt/ext:ro
      - ${LOG_DIR:-${HOME}/logs/glm53}:/logs
    # Host /etc/hosts is not visible under network_mode:host's container view.
    extra_hosts:
      - "spark-head:${HEAD_HOST:-192.168.100.10}"
      - "spark-worker:${WORKER_HOST:-192.168.100.20}"
    # RULE: knobs that also default in entrypoint.sh stay EMPTY here unless
    # this recipe intentionally owns them (HF model id, TP=2 production baseline).
    environment:
      - ROLE=${ROLE:-head}
      - NODE_RANK=${NODE_RANK:-0}
      - SERVICE_NAME=${SERVICE_NAME:-glm53}
      - SERVED_NAME=${SERVED_NAME:-glm53}
      - MENTAT_GROUP=${MENTAT_GROUP:-}
      - VLLM_HOST_IP=${VLLM_HOST_IP:-}
      - RAY_ADDRESS=${RAY_ADDRESS:-}
      # RoCE / cluster subnet prefix (entrypoint derives this node's address).
      - CLUSTER_SUBNET=${CLUSTER_SUBNET:-192.168.100.}
      - FABRIC_WAIT_S=${FABRIC_WAIT_S:-}
      - WORKER_WAIT_S=${WORKER_WAIT_S:-}
      - ROCE_SETTLE_S=${ROCE_SETTLE_S:-}
      # Same HEAD_HOST on every node (including head).
      - HEAD_HOST=${HEAD_HOST:-192.168.100.10}
      - RAY_memory_monitor_refresh_ms=${RAY_MEMORY_MONITOR_REFRESH_MS:-0}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-}
      - NCCL_IB_HCA=${NCCL_IB_HCA:-}
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-}
      - NCCL_MIN_NCHANNELS=${NCCL_MIN_NCHANNELS:-}
      - NCCL_MAX_NCHANNELS=${NCCL_MAX_NCHANNELS:-}
      - NCCL_DEBUG=${NCCL_DEBUG:-}
      - TP=${TP_SIZE:-${TP:-2}}
      - MTP=${MTP:-0}
      - SPEC_TOKENS=${SPEC_TOKENS:-}
      # Hub id preferred (no revision). Local path still works if MODEL is absolute.
      - MODEL=${MODEL:-canada-quant/glm-5.3-w4a16-mtp}
      - MODEL_DIR=${MODEL_DIR:-}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-1048576}
      - LIMIT_MM=${LIMIT_MM:-}
      - SKIP_MM_PROFILING=${SKIP_MM_PROFILING:-}
      - SAFETENSORS_LOAD_STRATEGY=${SAFETENSORS_LOAD_STRATEGY:-}
      - MOE_BACKEND=${MOE_BACKEND:-marlin}
      - PYTHONPATH=${PYTHONPATH:-/opt/ext}
      - VLLM_GLM53_CUDA_SPARSE_MLA=${VLLM_GLM53_CUDA_SPARSE_MLA:-}
      - GPU_MEM_UTIL=${GPU_MEM_UTIL:-0.88}
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      - TORCH_MEM_FRACTION=${TORCH_MEM_FRACTION:-}
      - TORCH_MEM_TRACE_DIR=${TORCH_MEM_TRACE_DIR:-}
      - TORCH_MEM_STATS_DIR=${TORCH_MEM_STATS_DIR:-/logs}
      - TORCH_MEM_STATS_INTERVAL=${TORCH_MEM_STATS_INTERVAL:-}
      - EXTRA_ARGS=${EXTRA_ARGS:-}
      - KV_CACHE_MEMORY=${KV_CACHE_MEMORY:-}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-8192}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-6}
      - LONG_PREFILL_TOKEN_THRESHOLD=${LONG_PREFILL_TOKEN_THRESHOLD:-}
      - DECODE_RESERVE_TOKENS=${DECODE_RESERVE_TOKENS:-}
      - CUDAGRAPH_CAPTURE_SIZES=${CUDAGRAPH_CAPTURE_SIZES:-}
      - CUDAGRAPH_METRICS=${CUDAGRAPH_METRICS:-}
      - ITERATION_DETAILS=${ITERATION_DETAILS:-}
      # Production baseline: enforce eager when ENFORCE_EAGER=1
      - CUDA_GRAPHS=${CUDA_GRAPHS:-0}
      - API_PORT=${API_PORT:-8002}
      - STATUS_PORT=${STATUS_PORT:-8082}
      - PEERS=${PEERS:-spark-head:8082,spark-worker:8082}
      - MCP_LOG_DIR=${MCP_LOG_DIR:-/logs}
      - CONTAINER_NAME=${CONTAINER_NAME:-glm53}
      - MENTAT_OPENAI_API=${MENTAT_OPENAI_API:-}
      - MENTAT_MCP_API=${MENTAT_MCP_API:-}
      - MENTAT_MODEL_PROVIDER=${MENTAT_MODEL_PROVIDER:-}
      - AGENT_URL=${AGENT_URL:-http://127.0.0.1:8090}
      - MAX_JOBS=${MAX_JOBS:-}
      - SELF_TEST=${SELF_TEST:-1}
      - THROUGHPUT_INTERVAL_S=${THROUGHPUT_INTERVAL_S:-60}
      - NVIDIA_VISIBLE_DEVICES=all
      # Optional HF token (never bake into image)
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
