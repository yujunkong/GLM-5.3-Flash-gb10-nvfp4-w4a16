# 2× DGX Spark TP=2 — upstream-based image (glm53-spark:2x-sm121)
# Distributed: mp (not mentat/ray). Model: Hub id via MODEL (no revision pin).
# Runtime overlays under ../patches are model-specific (W4A16/DFlash), adapted
# from the validated local 2× Spark bring-up — not a copy of that recipe's launcher.

name: glm53-flash-2x-spark

x-glm53-common: &glm53-common
  image: ${IMAGE:-glm53-spark:2x-sm121}
  build:
    context: ../image
    dockerfile: Dockerfile
    args:
      BASE: ${BASE:-vllm/vllm-openai:glm53-flash-arm64-cu130}
      MENTAT_VERSION: ${MENTAT_VERSION:-0.6.0}
  network_mode: host
  ipc: host
  shm_size: 32g
  ulimits:
    memlock: -1
    stack: 67108864
    core: 0
  devices:
    - /dev/infiniband:/dev/infiniband
  cap_add: [IPC_LOCK, SYS_PTRACE]
  volumes:
    # Runtime entrypoint (golden 2× serve argv) — override baked image copy.
    - ../image/entrypoint.sh:/entrypoint.sh:ro
    # Standard host cache → /root/.cache (HF at .../huggingface). No /var/tmp policy.
    - ${HOST_CACHE:-${HOME}/.cache}:/root/.cache
    - ${LOG_DIR:-${HOME}/logs/glm53}:/logs
    - ${EXT_DIR:-${HOME}/ext}:/opt/ext:ro
    # Multimodal chat template from this repo
    - ${CHAT_TEMPLATE_HOST:-../chat_template_mm.jinja}:/usr/local/share/glm53-chat-template.jinja:ro
    # KEEP overlays from validated 2× Spark recipe (GLM53_SM121_MLA=0 path).
    # glm5next: W4A16 dense MLP BF16 + SupportsEagle3 for DFlash2.
    - ../patches/glm5next_model.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/nvidia/model.py:ro
    - ../patches/sparse_attn_indexer_kpool.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro
    - ../patches/qwen3_dflash2.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_dflash2.py:ro
    - ../patches/dflash2_speculator.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/spec_decode/dflash2/speculator.py:ro
    # GB10 spin-wait overlay. Default pristine (busy_loop_s=1.0): patched 0.002
    # was MEASURED worse on this W4A16 stack (TPS −1.6%, drift worse). Toggle via
    # SPINWAIT_PATCH_HOST=../runtime/spinwait/shm_broadcast.patched.py
    - ${SPINWAIT_PATCH_HOST:-../runtime/spinwait/shm_broadcast.pristine.py}:/usr/local/lib/python3.12/dist-packages/vllm/distributed/device_communicators/shm_broadcast.py:ro
    - ../patches/spec_decode_rejection_warmup.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/warmup/spec_decode_rejection_warmup.py:ro
    - ../patches/deepseek_v4_mhc_warmup.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/warmup/deepseek_v4_mhc_warmup.py:ro
    # Hybrid APC (generated by scripts/gen-apc.sh)
    - ${APC_PATCH_HOST:-../runtime/apc/coordinator.patched.py}:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/kv_cache_coordinator.py:ro
    # DFlash+GLM5 KV groups (generated by scripts/gen-kv-groups.sh) — required for
    # SPEC_METHOD=dflash on upstream (radixark DFLASH2-DRAFTER-GROUP port).
    - ${KV_GROUPS_PATCH_HOST:-../runtime/kv/kv_cache_utils.patched.py}:/usr/local/lib/python3.12/dist-packages/vllm/v1/core/kv_cache_utils.py:ro
    # SM90 fp8 plan dtype: uint8 storage -> float8_e4m3fn for FlashInfer plan.
    - ${SM90_PATCH_HOST:-../runtime/sm90/flashinfer_mla_sparse_sm90.patched.py}:/usr/local/lib/python3.12/dist-packages/vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:ro
  environment: &glm53-env
    MODEL: ${MODEL:-canada-quant/glm-5.3-w4a16-mtp}
    DRAFT_MODEL: ${DRAFT_MODEL:-incoai/GLM-5.3-Flash-DFlash2}
    SERVED_NAME: ${SERVED_MODEL_NAME:-glm-5.3-flash}
    DIST_BACKEND: ${DIST_BACKEND:-mp}
    TP: ${TP_SIZE:-2}
    NNODES: ${NNODES:-2}
    MASTER_ADDR: ${HEAD_HOST:-192.168.100.10}
    MASTER_PORT: ${MASTER_PORT:-29521}
    HEAD_HOST: ${HEAD_HOST:-192.168.100.10}
    CLUSTER_SUBNET: ${CLUSTER_SUBNET:-192.168.100.}
    VLLM_HOST_IP: ${VLLM_HOST_IP:-}
    NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-enp1s0f0np0}
    GLOO_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-enp1s0f0np0}
    TP_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME:-enp1s0f0np0}
    MN_IF_NAME: ${NCCL_SOCKET_IFNAME:-enp1s0f0np0}
    NCCL_IB_HCA: ${NCCL_IB_HCA:-rocep1s0f0}
    NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX:-3}
    NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-192.168.100.0/24}
    NCCL_IB_ADDR_FAMILY: AF_INET
    NCCL_NET: IB
    NCCL_IB_DISABLE: "0"
    NCCL_IB_ROCE_VERSION_NUM: "2"
    NCCL_NVLS_ENABLE: "0"
    NCCL_CROSS_NIC: "0"
    NCCL_IB_MERGE_NICS: "0"
    NCCL_CUMEM_ENABLE: "0"
    NCCL_IGNORE_CPU_AFFINITY: "1"
    NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    TORCH_CUDA_ARCH_LIST: 12.1a
    FLASHINFER_CUDA_ARCH_LIST: 12.1a
    FLASHINFER_DISABLE_VERSION_CHECK: "1"
    PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    # Default 512 = vLLM stock. Override to 64 only for long-context experiments
    # (this-stack short soak A/B: 64 → TPS −2.77%).
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-512}
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-3600}
    SPEC_METHOD: ${SPEC_METHOD:-dflash}
    DFLASH_TOKENS: ${DFLASH_TOKENS:-7}
    DFLASH_SELECTOR_TOP_K: ${DFLASH_SELECTOR_TOP_K:-32}
    DFLASH_WALK_MODE: ${DFLASH_WALK_MODE:-edge}
    DFLASH2_ACC_PROBE: ${DFLASH2_ACC_PROBE:-0}
    MOE_BACKEND: ${MOE_BACKEND:-marlin}
    ENFORCE_EAGER: ${ENFORCE_EAGER:-1}
    CUDA_GRAPHS: ${CUDA_GRAPHS:-0}
    ASYNC_SCHEDULING: ${ASYNC_SCHEDULING:-1}
    DISABLE_FLASHINFER_AUTOTUNE: ${DISABLE_FLASHINFER_AUTOTUNE:-1}
    VLLM_MARLIN_USE_ATOMIC_ADD: ${VLLM_MARLIN_USE_ATOMIC_ADD:-1}
    VLLM_USE_FUSED_MOE_GROUPED_TOPK: ${VLLM_USE_FUSED_MOE_GROUPED_TOPK:-1}
    MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1048576}
    MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
    MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
    GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.85}
    KV_CACHE_MEMORY: ${KV_CACHE_MEMORY:-9663676416}
    KV_CACHE_DTYPE: ${KV_CACHE_DTYPE:-fp8_e4m3}
    BLOCK_SIZE: ${BLOCK_SIZE:-2304}
    API_PORT: ${API_PORT:-8000}
    STATUS_PORT: ${STATUS_PORT:-8082}
    SELF_TEST: ${SELF_TEST:-0}
    HF_TOKEN: ${HF_TOKEN:-}
    CHAT_TEMPLATE: /usr/local/share/glm53-chat-template.jinja
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  restart: "no"

services:
  glm53-worker:
    <<: *glm53-common
    container_name: glm53
    profiles: [worker]
    environment:
      <<: *glm53-env
      ROLE: worker
      NODE_RANK: "1"
      VLLM_HOST_IP: ${WORKER_HOST:-192.168.100.20}

  glm53-head:
    <<: *glm53-common
    container_name: glm53
    profiles: [head]
    environment:
      <<: *glm53-env
      ROLE: head
      NODE_RANK: "0"
      VLLM_HOST_IP: ${HEAD_HOST:-192.168.100.10}
