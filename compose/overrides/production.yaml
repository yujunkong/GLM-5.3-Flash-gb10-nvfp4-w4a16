# Optional production knob overlay (EXPERIMENT / documentation ONLY).
# NOT used by scripts/up.sh — defaults already in compose/glm53.yaml + .env.example.
# Aligns with v1.0.0-golden (GPU_MEM_UTIL=0.85).

services:
  glm53-head:
    environment:
      MOE_BACKEND: ${MOE_BACKEND:-marlin}
      CUDA_GRAPHS: ${CUDA_GRAPHS:-0}
      ENFORCE_EAGER: ${ENFORCE_EAGER:-1}
      DISABLE_FLASHINFER_AUTOTUNE: ${DISABLE_FLASHINFER_AUTOTUNE:-1}
      ASYNC_SCHEDULING: ${ASYNC_SCHEDULING:-1}
      APPLY_APC_PATCH: ${APPLY_APC_PATCH:-1}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1048576}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.85}
      DFLASH_TOKENS: ${DFLASH_TOKENS:-7}
      DFLASH_SELECTOR_TOP_K: ${DFLASH_SELECTOR_TOP_K:-32}
      DFLASH_WALK_MODE: ${DFLASH_WALK_MODE:-edge}
      DFLASH2_ACC_PROBE: ${DFLASH2_ACC_PROBE:-0}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-512}
  glm53-worker:
    environment:
      MOE_BACKEND: ${MOE_BACKEND:-marlin}
      CUDA_GRAPHS: ${CUDA_GRAPHS:-0}
      ENFORCE_EAGER: ${ENFORCE_EAGER:-1}
      DISABLE_FLASHINFER_AUTOTUNE: ${DISABLE_FLASHINFER_AUTOTUNE:-1}
      ASYNC_SCHEDULING: ${ASYNC_SCHEDULING:-1}
      APPLY_APC_PATCH: ${APPLY_APC_PATCH:-1}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1048576}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      GPU_MEM_UTIL: ${GPU_MEM_UTIL:-0.85}
      DFLASH_TOKENS: ${DFLASH_TOKENS:-7}
      DFLASH_SELECTOR_TOP_K: ${DFLASH_SELECTOR_TOP_K:-32}
      DFLASH_WALK_MODE: ${DFLASH_WALK_MODE:-edge}
      DFLASH2_ACC_PROBE: ${DFLASH2_ACC_PROBE:-0}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-512}
