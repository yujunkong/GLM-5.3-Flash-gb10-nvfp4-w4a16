# Optional DFlash2 env overlay (EXPERIMENT ONLY).
# NOT used by scripts/up.sh — knobs already in compose/glm53.yaml + .env.
# Service names must match compose/glm53.yaml (glm53-head / glm53-worker).

services:
  glm53-head:
    environment:
      DRAFT_MODEL: ${DRAFT_MODEL:-incoai/GLM-5.3-Flash-DFlash2}
      DFLASH_TOKENS: ${DFLASH_TOKENS:-7}
      DFLASH_SELECTOR_TOP_K: ${DFLASH_SELECTOR_TOP_K:-32}
      DFLASH_WALK_MODE: ${DFLASH_WALK_MODE:-edge}
      DFLASH2_ACC_PROBE: ${DFLASH2_ACC_PROBE:-0}
  glm53-worker:
    environment:
      DRAFT_MODEL: ${DRAFT_MODEL:-incoai/GLM-5.3-Flash-DFlash2}
      DFLASH_TOKENS: ${DFLASH_TOKENS:-7}
      DFLASH_SELECTOR_TOP_K: ${DFLASH_SELECTOR_TOP_K:-32}
      DFLASH_WALK_MODE: ${DFLASH_WALK_MODE:-edge}
      DFLASH2_ACC_PROBE: ${DFLASH2_ACC_PROBE:-0}
